# Umami (web analytics). Data lives in the shared Postgres (database: umami).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:3.4.0
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: umami
            # Last, so it wins: values set at runtime through the MCP (or2_env_set); Flux does not manage it.
            - secretRef:
                name: runtime-env
                optional: true
          env:
            # Real visitor IP from Cloudflare, for location stats.
            - name: CLIENT_IP_HEADER
              value: cf-connecting-ip
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
