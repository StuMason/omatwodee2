# Only /authorize is behind Cloudflare Access (an Access app scoped to that path).
# /register, /token, /mcp and the .well-known metadata stay reachable for clients.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: or2-mcp
  namespace: or2
spec:
  ingressClassName: traefik
  rules:
    - host: "mcp${HOST_SUFFIX}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: or2-mcp
                port:
                  name: http
