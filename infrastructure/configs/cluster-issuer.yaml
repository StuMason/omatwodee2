# Let's Encrypt over HTTP-01 through the Traefik that ships with k3s.
# No contact email by default. To get expiry warnings, add under acme:
#   email: you@yourdomain
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
