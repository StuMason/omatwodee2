# The agent's API identity (or2-agent). Two roles:
#  - or2-agent-read: read almost everything cluster-wide, but never Secrets.
#  - or2-agent-operate: runtime operations (restart, scale, env and secret values,
#    exec, logs, run a job, delete a pod). Granted per app namespace by a
#    RoleBinding that ships with each app, so it never reaches flux-system,
#    kube-system or cnpg-system.
#  - or2-agent-db: database backups in the `database` namespace (no Secrets).
# Tokens are minted by an admin with `kubectl create token`; delete and recreate
# the ServiceAccount to revoke every token at once.
apiVersion: v1
kind: Namespace
metadata:
  name: or2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: or2-agent
  namespace: or2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: or2-agent-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, namespaces, nodes, persistentvolumeclaims, persistentvolumes, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups, scheduledbackups, databases, poolers]
    verbs: [get, list, watch]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io, source.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: or2-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: or2-agent-read
subjects:
  - kind: ServiceAccount
    name: or2-agent
    namespace: or2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: or2-agent-operate
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [patch, update]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: or2-agent-db
  namespace: database
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: or2-agent-db
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: or2-agent-db
subjects:
  - kind: ServiceAccount
    name: or2-agent
    namespace: or2
