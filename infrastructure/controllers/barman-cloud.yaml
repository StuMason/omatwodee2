# CloudNativePG's backup plugin (Barman Cloud): base backups + WAL archiving to
# S3-compatible storage (R2). Needs cert-manager for its operator <-> plugin TLS.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 1h
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1  # plugin v0.15.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
