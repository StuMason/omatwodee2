# Daily base backup at 03:00 UTC, plus one as soon as this is applied.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shared-daily
  namespace: database
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: shared
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
