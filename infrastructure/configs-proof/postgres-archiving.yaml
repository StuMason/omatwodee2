# Continuous WAL archiving to the r2 ObjectStore (point-in-time restore).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared
  namespace: database
spec:
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2
  # App login roles; passwords come from the encrypted <app>-db-role Secrets.
  managed:
    roles:
      - name: umami
        login: true
        passwordSecret:
          name: umami-db-role
      - name: bugsink
        login: true
        passwordSecret:
          name: bugsink-db-role
