name: mcp
on:
  push:
    branches: [main]
    paths: ['mcp/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['mcp/**', '.github/workflows/mcp.yml']

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    # Public repo: GitHub-hosted ARM runner (free for public repos). Never the
    # self-hosted runners, which serve private repos only.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
    concurrency:
      group: mcp-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: mcp
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/stumason/omatwodee2-mcp:${{ steps.tag.outputs.tag }}
            ghcr.io/stumason/omatwodee2-mcp:main
      - name: Deploy (bump the image tag; Flux applies it)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          f=apps-proof/or2-mcp/deployment.yaml
          [ -f "$f" ] || { echo "no $f yet, nothing to deploy"; exit 0; }
          sed -i -E "s#(ghcr.io/stumason/omatwodee2-mcp:)[A-Za-z0-9._-]+#\1${TAG}#" "$f"
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: omatwodee2-mcp ${TAG} [skip ci]"
          git pull --rebase -q && git push
